[project]
name = "backend"
version = "0.1.0"
description = "API de Radar Vecinal: reportes ciudadanos (Vecino) y acciones de respuesta (Municipalidad)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"
